; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:Test_Firmware]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

;Remove these for release version
build_type = debug
debug_tool = esp-builtin
monitor_filters = esp32_exception_decoder

board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.psram_type = qio

board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304

board_build.partitions = default.csv
board_build.extra_flags = -DBOARD_HAS_PSRAM

build_flags =
	; ALL BUILD FLAGS WERE FOUND BY CHATGPT
    -DARDUINO_RUNNING_CORE=0
    -DCONFIG_ELF_LOADER
	-DCONFIG_ELF_DYNAMIC_LOAD_SHARED_OBJECT
	-DCONFIG_ELF_FILE_SYSTEM_BASE_PATH='"/appdata"'
	-DCONFIG_ELF_LOADER_CACHE_OFFSET
	-DCONFIG_ELF_LOADER_BUS_ADDRESS_MIRROR
	; -DCONFIG_ELF_LOADER_SET_MMU
	-DCONFIG_ELF_LOADER_LOAD_PSRAM
	-DCONFIG_ELF_LOADER_LIBC_SYMBOLS
	-DCONFIG_ELF_LOADER_ESPIDF_SYMBOLS
	-DCONFIG_ELF_LOADER_CUSTOMER_SYMBOLS
	-DCONFIG_ELF_LOADER_NUMBER_SYMBOLS=32

lib_deps =
    h2zero/NimBLE-Arduino
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library
    adafruit/Adafruit NeoPixel
    lovyan03/LovyanGFX
    https://github.com/andreock/esp_elf_loader_arduino